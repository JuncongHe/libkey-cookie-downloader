[project]
name = "lkfetch"
version = "0.0.0"
description = "Unofficial single-DOI LibKey PDF downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["browser-cookie3>=0.20.1"]

[project.scripts]
lkfetch = "lkfetch.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
